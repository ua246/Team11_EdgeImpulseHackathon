profiles:
  default:
    platforms:
      - platform: arduino:zephyr
    libraries:
      # Needed by the Bridge library on boards with the older Zephyr core (0.52, App Lab 0.7);
      # newer cores bundle them.
      - MsgPack (0.4.2)
      - DebugLog (0.8.4)
      - ArxContainer (0.7.0)
      - ArxTypeTraits (0.3.2)
default_profile: default
